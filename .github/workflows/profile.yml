# .github/workflows/profile.yml  (in kerolosxgad/kerolosxgad)
#
# Setup
# -----
# 1. Settings -> Actions -> General -> Workflow permissions
#       -> "Read and write permissions"
# 2. Settings -> Secrets and variables -> Actions -> New repository secret
#       Name:  PROFILE_TOKEN
#       Value: your classic PAT (read:user + public_repo, no expiry)
# 3. Actions tab -> "Profile assets" -> Run workflow, once, to seed images/.
#
# Jobs are chained with needs: so only one of them ever holds the branch.
# Each job re-checks-out, so it always starts from the previous job's commit.

name: Profile assets

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- stats card + language breakdown -------------------------------------
  # user-statistician commits and pushes on its own, so no commit step here.
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Overall stats
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/userstats.svg
          colors: dark
          hide-keys: joined
          fail-on-error: false

      - name: Languages only
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/langs.svg
          colors: dark
          hide-keys: general, repositories, contributions
          language-count: 8
          fail-on-error: false

  # ---- trophies, rendered in-workflow instead of via the Vercel service ----
  trophy:
    needs: stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: kerolosxgad
          output_path: images/trophy.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update trophy"
          file_pattern: images/trophy.svg

  # ---- metrics infographic + contribution snake ----------------------------
  activity:
    needs: trophy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_TOKEN }}
          user: kerolosxgad
          filename: images/metrics.svg
          # Write to disk only. Without this, metrics commits via the GitHub
          # API, the remote moves ahead of this checkout, and the commit step
          # below fails with a non-fast-forward rejection.
          output_action: none
          template: classic
          base: activity, community, repositories
          config_timezone: Africa/Cairo
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_limit: 8

      - uses: Platane/snk@v3
        with:
          github_user_name: kerolosxgad
          outputs: images/snake.svg

      # One commit for both SVGs.
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update activity graphs"
          file_pattern: images/*.svg
