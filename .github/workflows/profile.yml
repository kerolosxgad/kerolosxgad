# .github/workflows/profile.yml  (in kerolosxgad/kerolosxgad)

name: Profile assets

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- stats card + language chart ----------------------------------------
  # user-statistician shells out to the gh CLI, so the token has to arrive as an
  # env var - a `with:` input will not reach it. Default GITHUB_TOKEN perms are
  # enough. fail-on-error left at its default (true) so a bad input shows up as
  # a red job instead of a silently missing file.
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Full stats card
        uses: cicirello/user-statistician@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-file: images/userstats.svg
          colors: dark

      - name: Language chart only
        uses: cicirello/user-statistician@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-file: images/langs.svg
          colors: dark
          category-order: languages   # not hide-keys: that hides single stats
          max-languages: 8            # not language-count

  # ---- trophies -----------------------------------------------------------
  # No continue-on-error: it reports the job green even when the step fails,
  # which hides exactly this kind of push error. activity runs regardless
  # because of its `if: always()`.
  trophy:
    needs: stats
    runs-on: ubuntu-latest
    steps:
      # ref: pins to the branch TIP. Without it checkout lands on github.sha,
      # the commit that triggered the run, which is already behind after the
      # stats job pushed - and the commit step below gets rejected.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - run: git pull --rebase origin ${{ github.ref_name }}

      - uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: kerolosxgad
          output_path: images/trophy.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update trophy"
          file_pattern: images/trophy.svg

  # ---- metrics infographic + contribution snake ---------------------------
  activity:
    needs: trophy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_TOKEN }}
          user: kerolosxgad
          filename: metrics.svg
          output_action: none
          template: classic
          base: activity, community, repositories
          config_timezone: Africa/Cairo
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_limit: 8

      # output_action: none writes to /metrics_renders/, NOT the workspace.
      # Without this copy there is nothing for git to commit.
      - name: Move render into the repo
        run: |
          mkdir -p images
          cp /metrics_renders/metrics.svg images/metrics.svg

      - uses: Platane/snk@v3
        with:
          github_user_name: kerolosxgad
          outputs: images/snake.svg

      - run: git pull --rebase origin ${{ github.ref_name }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update activity graphs"
          file_pattern: images/*.svg
