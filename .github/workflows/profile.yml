# .github/workflows/profile.yml  (in kerolosxgad/kerolosxgad)
#
# One-time setup
# --------------
# 1. Settings -> Actions -> General -> Workflow permissions
#       -> "Read and write permissions"
# 2. Create a classic PAT, scopes: read:user, public_repo
#    (add repo only if you want private-repo contributions counted).
#    Give it NO expiry, otherwise you get the rate-limit error again later.
# 3. Settings -> Secrets and variables -> Actions -> New repository secret
#       Name: PROFILE_TOKEN
# 4. Actions tab -> "Profile assets" -> Run workflow, once, to seed images/.
#
# Jobs run in sequence (needs:) so they never race each other on git push.

name: Profile assets

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---- stats card + language pie, MIT, pure GitHub Action -------------------
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Overall stats
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/userstats.svg
          colors: dark
          hide-keys: joined
          fail-on-error: false

      - name: Languages only
        uses: cicirello/user-statistician@v1
        with:
          image-file: images/langs.svg
          colors: dark
          hide-keys: general, repositories, contributions
          language-count: 8
          fail-on-error: false

  # ---- trophies, generated locally instead of hitting the Vercel service ----
  trophy:
    needs: stats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The upstream repo ships an action that renders the SVG in-workflow,
      # which removes the dependency on an online instance entirely.
      - uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: kerolosxgad
          output_path: images/trophy.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update trophy"
          file_pattern: images/trophy.svg

  # ---- metrics infographic + snake ----------------------------------------
  activity:
    needs: trophy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PROFILE_TOKEN }}
          user: kerolosxgad
          filename: images/metrics.svg
          template: classic
          base: activity, community, repositories
          config_timezone: Africa/Cairo
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_limit: 8

      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: kerolosxgad
          outputs: images/snake.svg

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update activity graphs"
          file_pattern: images/snake.svg
